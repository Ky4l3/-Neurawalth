services:
  - type: web
    name: strove-leads
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    disk:
      name: strove-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/strove_leads.db
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
